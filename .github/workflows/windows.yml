name: Windows validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p weld-core -p weld-application -p weld-api --all-targets -- -D warnings
      - run: cargo test --locked -p weld-core -p weld-application -p weld-api
  desktop:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@v4
        id: desktop-cache
        with:
          path: target
          key: ${{ runner.os }}-desktop-rust-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-desktop-rust-v2-
            ${{ runner.os }}-desktop-rust-
      - run: npm ci --no-audit --no-fund
      - name: Verify frontend tests in three fresh processes
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "Frontend cold-process verification $_/3"
            npm test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm run build
      - name: Check Windows development profile used by start.bat
        run: cargo check --locked -p weld-desktop
      - name: Build Windows desktop executable
        run: npm run tauri build -- --no-bundle --ci
      - name: Build standalone Windows API
        run: cargo build --locked --release -p weld-api
      - name: Compile future CAD C# transport example
        working-directory: .\
        run: dotnet build examples/inventor-client/WeldClient.csproj --configuration Release
      - name: Exercise loopback API over HTTP and validate OpenAPI contracts
        shell: pwsh
        working-directory: .\
        run: ./scripts/windows-api-smoke.ps1
      - uses: actions/cache/save@v4
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        with:
          path: target
          key: ${{ steps.desktop-cache.outputs.cache-primary-key }}
      - name: Exercise real desktop calculation and SQLite workflow
        shell: pwsh
        working-directory: .
        run: ./scripts/windows-desktop-smoke.ps1
      - name: Read generated Cyrillic PDF and embedded project with an independent parser
        working-directory: .\
        run: |
          python -m pip install --disable-pip-version-check pypdf==6.1.1
          python scripts/inspect-generated-pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: weld-engineering-windows-x64
          path: |
            target/release/weld-desktop.exe
            target/release/weld-api.exe
            target/windows-ui-smoke.png
            target/windows-results-smoke.png
            target/weld-report-smoke.pdf
          if-no-files-found: error
          retention-days: 7
      - name: Preserve synthetic UI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weld-engineering-windows-ui-diagnostics
          path: target/windows-*-smoke.png
          if-no-files-found: ignore
          retention-days: 3
